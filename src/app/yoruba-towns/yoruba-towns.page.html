<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Yoruba Towns
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Yoruba Towns</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list inset>
    <ion-item *ngFor="let t of towns">
      <ion-label>
        <h3>{{ t.name }}</h3>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
