<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Dictionary
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Dictionary</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Search Bar -->
  <ion-searchbar 
    [(ngModel)]="searchTerm" 
    (ionInput)="onSearchChange($event)"
    placeholder="Search animals..."
    show-clear-button="focus"
    debounce="300">
  </ion-searchbar>

  <!-- Filter Buttons -->
  <ion-segment [(ngModel)]="selectedCategory" (ionChange)="onCategoryChange($event)">
    <ion-segment-button value="all">
      <ion-label style="font-size: 8px;">All</ion-label>
    </ion-segment-button>
    <ion-segment-button value="mammals">
      <ion-label style="font-size: 8px;">Mammals</ion-label>
    </ion-segment-button>
    <ion-segment-button value="birds">
      <ion-label style="font-size: 8px;">Birds</ion-label>
    </ion-segment-button>
    <ion-segment-button value="reptiles">
      <ion-label style="font-size: 8px;">Reptiles</ion-label>
    </ion-segment-button>
    <ion-segment-button value="insects">
      <ion-label style="font-size: 8px;">Insects</ion-label>
    </ion-segment-button>
    <ion-segment-button value="aquatic">
      <ion-label style="font-size: 8px;">Aquatic</ion-label>
    </ion-segment-button>
  </ion-segment>

  <!-- Loading Spinner -->
  <div *ngIf="isLoading" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Loading dictionary...</p>
  </div>

  <!-- Dictionary Grid -->
  <div *ngIf="!isLoading" class="dictionary-container">
    <div *ngIf="filteredAnimals.length === 0" class="no-results">
      <ion-icon name="search-outline" size="large"></ion-icon>
      <h3>No animals found</h3>
      <p>Try adjusting your search or filter criteria</p>
    </div>

    <ion-grid *ngIf="filteredAnimals.length > 0">
      <ion-row>
        <ion-col size="6" size-md="4" size-lg="3" *ngFor="let animal of filteredAnimals">
          <ion-card class="animal-card" (click)="openAnimalDetail(animal)">
            <div class="image-container">
              <img [src]="animal.picture" [alt]="animal.name" loading="lazy" 
                   (error)="onImageError($event)" class="animal-image">
            </div>
            <ion-card-content>
              <h3 class="animal-name">{{ animal.name }}</h3>
              <p class="yoruba-name">{{ animal.yorubaName }}</p>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

  <!-- Animal Detail Modal -->
  <ion-modal [isOpen]="isModalOpen" (didDismiss)="closeModal()">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>{{ selectedAnimal?.name }}</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="closeModal()">
              <ion-icon name="close"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content *ngIf="selectedAnimal">
        <div class="modal-content">
          <div class="modal-image-container">
            <img [src]="selectedAnimal.picture" [alt]="selectedAnimal.name" class="modal-image">
          </div>
          <div class="modal-info">
            <h2>{{ selectedAnimal.name }}</h2>
            <h3 class="yoruba-translation">{{ selectedAnimal.yorubaName }}</h3>
            <div class="pronunciation">
              <ion-button fill="outline" (click)="speakText(selectedAnimal.yorubaName)">
                <ion-icon name="volume-high" slot="start"></ion-icon>
                Pronounce
              </ion-button>
            </div>
          </div>
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
