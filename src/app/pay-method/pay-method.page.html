<ion-content>
  <div class="container">
    <div class="header">
      <ion-button fill="clear" class="close-button">
        <ion-icon name="close"></ion-icon>
      </ion-button>
      <div class="logo-container">
        <img
          src="../../assets/icon/Group 63.svg"
          alt="Flutterwave"
          class="logo"
        />
        <p class="flutterwave">Flutterwave</p>
      </div>
    </div>

    <div class="payment-container">
      <!-- Payment Form -->
      <div class="form-container">
        <ion-input class="input-field" placeholder="Card Number"></ion-input>
        <ion-input
          class="input-field"
          placeholder="Cardholder Name"
        ></ion-input>

        <div class="input-row">
          <ion-input class="small-input" placeholder="Expiry"></ion-input>
          <ion-input class="small-input cvv-input" placeholder="Cvv">
            <ion-icon
              slot="end"
              name="information-circle-outline"
              class="info-icon"
            ></ion-icon>
          </ion-input>
        </div>
      </div>
      <!-- Pay Button -->
      <ion-button expand="block" class="pay-button">
        <ion-icon name="lock-closed-outline"></ion-icon>
        Pay N50,000
      </ion-button>
    </div>
  </div>
</ion-content>
