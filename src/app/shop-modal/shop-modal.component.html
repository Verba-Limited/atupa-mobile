<ion-content>
  <div class="container">
    <div class="image">
      <img src="../../assets/icon/Group 50.svg" alt="" />
    </div>
    <ion-icon
      name="close-outline"
      class="close-button"
      slot=""
      (click)="closeModal()"
    ></ion-icon>

    <div class="shop-content">
      <div class="header">Shop</div>
      <p class="paragra">Available Eleke: <span>0</span></p>

      <!-- board.component.html -->
      <div class="board-container">
        <div class="row" *ngFor="let item of boardItems">
          <div class="image-container">
            <img
              class="background-ibundlePackmage"
              src="../../assets/icon/Rectangle 73.svg"
              alt="Background"
            />
            <div class="content">
              <img class="icon" src="../../assets/icon/dots.svg" alt="Icon" />
              <p class="title">Ekele</p>
            </div>
            <div class="badge" *ngIf="item.hasVideo">
              <img src="../../assets/icon/video 1.svg" alt="" />
            </div>
          </div>
          <p class="amount">{{ item.amount }}</p>
          <button class="buy-btn">{{ item.buttonText }}</button>
        </div>
      </div>

      <div style="padding: 10px">
        <div class="bundle-card">
          <!-- Top Header / Banner -->
          <div class="bundle-header">
            <p>Bundle Pack</p>
          </div>

          <!-- Items List -->
          <div class="bundle-items">
            <div class="bundle-item" *ngFor="let item of bundlePack">
              <img [src]="item.icon" [alt]="item.title" />
              <span>{{ item.title }}</span>
              <span>x5</span>
            </div>
          </div>

          <!-- Price/Buy Button -->
          <button (click)="openPaymentModal()" class="bundle-buy">
            ₦20000 Buy
          </button>
        </div>

        <div>
          <ion-button class="back-button" expand="block" (click)="closeModal()"
            >Back to Quiz</ion-button
          >
        </div>
      </div>
    </div>
  </div>
</ion-content>
