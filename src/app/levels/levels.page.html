<ion-content>
  <div class="levels-container">
    <!-- Header -->
    <ion-icon
      (click)="navigateBack()"
      name="arrow-back-outline"
      class="back-arrow"
    ></ion-icon>
    <div class="framer">
      <h2>Levels</h2>
      <p>
        Let's play quiz to move to the next <br />
        level answer all 10 questions
      </p>
    </div>

    <!-- Levels List -->
    <div class="levels-list">
      <!-- Unlocked Levels -->
      <button (click)="quizPage()" class="level-btn unlocked">
        <ion-icon name="checkmark-circle"></ion-icon>
        <span>Level 1</span>
      </button>

      <button class="level-btn unlocked">
        <ion-icon name="checkmark-circle"></ion-icon>
        <span>Level 2</span>
      </button>

      <button class="level-btn unlocked">
        <ion-icon name="play-circle"></ion-icon>
        <span>Level 3</span>
      </button>

      <!-- Locked Levels -->
      <button class="level-btn locked" disabled>
        <ion-icon name="lock-closed"></ion-icon>
        <span>Level 4</span>
      </button>

      <button class="level-btn locked" disabled>
        <ion-icon name="lock-closed"></ion-icon>
        <span>Level 5</span>
      </button>

      <button class="level-btn locked" disabled>
        <ion-icon name="lock-closed"></ion-icon>
        <span>Level 6</span>
      </button>

      <button class="level-btn locked" disabled>
        <ion-icon name="lock-closed"></ion-icon>
        <span>Level 7</span>
      </button>

      <button class="level-btn locked" disabled>
        <ion-icon name="lock-closed"></ion-icon>
        <span>Level 8</span>
      </button>

      <button class="level-btn locked" disabled>
        <ion-icon name="lock-closed"></ion-icon>
        <span>Level 9</span>
      </button>
    </div>
  </div>
</ion-content>
