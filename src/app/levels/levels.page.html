<ion-content>
  <div class="levels-container">
    <!-- Header -->
    <ion-icon
      (click)="navigateBack()"
      name="arrow-back-outline"
      class="back-arrow"></ion-icon>
    <div class="framer">
      <h2>Levels</h2>
      <p>
        Let's play quiz to move to the next <br />
        level answer all 10 questions
      </p>
    </div>

    <!-- Levels List -->
    <div class="levels-list">
      <!-- Level buttons - dynamically rendered based on state -->
      <ng-container *ngFor="let level of levelNumbers">
        <button 
          (click)="goToPage(pageFrom, level)" 
          class="level-btn" 
          [ngClass]="{
            'unlocked': isLevelUnlocked(level) && !isLevelCompleted(level), 
            'completed': isLevelCompleted(level),
            'locked': !isLevelUnlocked(level)
          }"
          [disabled]="!isLevelUnlocked(level)">
          
          <!-- Completed level -->
          <ion-icon *ngIf="isLevelCompleted(level)" name="checkmark-circle"></ion-icon>
          
          <!-- Unlocked but not completed level -->
          <ion-icon *ngIf="isLevelUnlocked(level) && !isLevelCompleted(level)" name="play-circle"></ion-icon>
          
          <!-- Locked level -->
          <ion-icon *ngIf="!isLevelUnlocked(level)" name="lock-closed"></ion-icon>
          
          <span>Level {{level}}</span>
        </button>
      </ng-container>
    </div>
  </div>
</ion-content>
