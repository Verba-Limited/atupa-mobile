<ion-content>
  <div class="container-wrap">
    <div class="framer">
      <div class="quiz">
        <img src="../../assets/icon/Rectangle 42.svg" alt="" />
        <p class="quiz-text">QUIZ</p>
      </div>
      <p class="quiz-description">
        Select the category of quiz you <br />
        want to play

          <div class="card-content">

              <ion-icon src="../../assets/icon/Vector.svg"></ion-icon>

            </div>
            <div class="play-section">
              <img src="../../assets/icon/Rectangle 19.svg" alt="" style="margin-top: 15px" />

            </div>
          </div>
        </div>
