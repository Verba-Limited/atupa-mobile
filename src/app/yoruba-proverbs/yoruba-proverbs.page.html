<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Yoruba Proverbs
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Yoruba Proverbs</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list inset>
    <ion-item *ngFor="let p of proverbs">
      <ion-label>
        <h3>{{ p.yoruba }}</h3>
        <p>{{ p.meaning }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
