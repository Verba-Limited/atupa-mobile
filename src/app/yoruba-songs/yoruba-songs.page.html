<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Yoruba Songs
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Yoruba Songs</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list inset>
    <ion-item button *ngFor="let s of songs" (click)="viewSongDetail(s)">
      <ion-label>
        <h3>{{ s.title }}</h3>
      </ion-label>
      <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
