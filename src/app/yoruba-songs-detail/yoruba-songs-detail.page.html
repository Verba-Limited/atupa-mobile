<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/general/yoruba-songs"></ion-back-button>
    </ion-buttons>
    <ion-title>Song Details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" *ngIf="song">
  <div class="detail-container">
    <div class="header-section">
      <ion-icon name="musical-notes" class="song-icon"></ion-icon>
      <h1 class="song-title">{{ song.title }}</h1>
    </div>

    <div class="content-section">
      <div class="audio-section" *ngIf="song.audioUrl || song.embedUrl">
        <h2>Listen</h2>
        <div class="audio-player" *ngIf="safeEmbedUrl">
          <iframe 
            [src]="safeEmbedUrl" 
            width="100%" 
            [height]="isYouTubeEmbed ? '315' : '152'" 
            scrolling="no" 
            frameborder="no" 
            allow="autoplay"
            [class]="isYouTubeEmbed ? 'embed-player youtube-embed' : 'embed-player'">
          </iframe>
        </div>
        <div class="audio-player" *ngIf="song.audioUrl && !isEmbedUrl(song.audioUrl) && !song.embedUrl">
          <ion-button 
            (click)="toggleAudio()" 
            [color]="isPlaying ? 'primary' : 'medium'"
            fill="outline"
            class="play-button">
            <ion-icon [name]="isPlaying ? 'pause' : 'play'" slot="start"></ion-icon>
            <ion-label>{{ isPlaying ? 'Pause' : 'Play' }}</ion-label>
          </ion-button>
        </div>
      </div>

      <div class="lyrics-section">
        <h2>Lyrics</h2>
        <div class="lyrics-text">
          <pre>{{ song.lyrics }}</pre>
        </div>
      </div>

      <div class="interpretation-section">
        <h2>Interpretation</h2>
        <div class="interpretation-text">
          <pre>{{ song.interpretation }}</pre>
        </div>
      </div>
    </div>
  </div>
</ion-content>

<ion-content *ngIf="!song">
  <div class="error-container">
    <ion-icon name="alert-circle-outline" size="large"></ion-icon>
    <h2>Song not found</h2>
    <ion-button (click)="goBack()">Go Back</ion-button>
  </div>
</ion-content>
