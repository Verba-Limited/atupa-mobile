<ion-content>
  <div>
    <div class="head">
      <div>
        <h1 class="header">Lesson</h1>
      </div>
      <div class="menu-container">
        <ion-icon
          src="../../assets/icon/ellipsis-vertical 1.svg"
          class="back-arrow"
          (click)="toggleMenu()"
        ></ion-icon>

        <!-- Dropdown Menu -->
        <div class="dropdown-menu" [class.show-menu]="isMenuVisible">
          <div class="menu-item" (click)="navigateToBookmarks()">
            <ion-icon
              src="../../assets/icon/Vectorbook.svg"
              class="menu-icon"
            ></ion-icon>
            <span>Bookmarks</span>
          </div>
          <div class="menu-item" (click)="manageSubscription()">
            <ion-icon
              src="../../assets/icon/Vectorn.svg"
              class="menu-icon"
            ></ion-icon>
            <span>Manage Subscription</span>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <div *ngIf="showSubscription">
        <div class="subscription-container">
          <h1 class="title">Monthly subscription</h1>

          <div class="progress-container">
            <div class="progress-bar">
              <div class="progress-filled"></div>
            </div>
            <div class="days-left">20 days left</div>
          </div>

          <button (click)="closeSubscripton()" class="manage-button">
            Manage Subscription
          </button>
        </div>
      </div>
      <div class="sub-header">
        <p class="title">Popular Lessons</p>
        <p class="view-title">View all</p>
      </div>

      <div class="scroll-container">
        <div class="lesson-wrap">
          <div class="proverb-card">
            <div
              class="proverb-wrapper"
              *ngFor="let item of lessonItem"
              [style.background-color]="item.bgColor"
              [routerLink]="item.link"
            >
              <div class="proverb-image">
                <img [src]="item.image" alt="" />
              </div>

              <div class="proverb-content">
                <h2 class="owe">{{item.name}}</h2>

                <p class="know-small">
                  {{item.hour}} hours
                  <span
                    ><img src="../../assets/icon/Ellipse 37.svg" alt=""
                  /></span>
                  16 sessions
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="sub-header">
          <p class="title">Category</p>
          <p class="view-title">View all</p>
        </div>
        <div class="scroll-container">
          <div class="lesson-wrap">
            <div class="proverb-card">
              <div
                class="proverb-wrapper"
                *ngFor="let item of catgoryItem"
                [style.background-color]="item.bgColor"
                [routerLink]="item.link"
              >
                <div class="proverb-image">
                  <img [src]="item.image" alt="" />
                </div>

                <div class="proverb-content">
                  <h2 class="owe">{{item.name}}</h2>

                  <p class="know-small">
                    {{item.hour}} hours
                    <span
                      ><img src="../../assets/icon/Ellipse 37.svg" alt=""
                    /></span>
                    16 sessions
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="quiz">
        <div class="sub-header">
          <p class="title">My Lessons</p>
          <p class="view-title">View all</p>
        </div>
        <div class="latest">
          <div class="quiz-container">
            <!-- Left: Image -->
            <div class="icon">
              <img src="../../assets/icon/Group 627.svg" alt="Eranko icon" />
            </div>

            <!-- Middle: Title and Button -->
            <div class="quiz-info">
              <h3 class="title">Girama - Session 7</h3>
              <button (click)="LessonsPage()" class="continue-btn">
                Continue
              </button>
            </div>

            <!-- Right: Progress Circle -->
            <div class="progress-circle">
              <span class="progress-text">5/10</span>
            </div>
          </div>
        </div>
        <br />
        <div class="latest">
          <div class="quiz-container">
            <!-- Left: Image -->
            <div class="icon2">
              <img src="../../assets/icon/Group 624.svg" alt="Eranko icon" />
            </div>

            <!-- Middle: Title and Button -->
            <div class="quiz-info">
              <h3 class="title">Alufabeti - Session 7</h3>
              <button class="continue-btn">Continue</button>
            </div>

            <!-- Right: Progress Circle -->
            <div class="progress-circle2">
              <span class="progress-text">6/10</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ion-content>
