<ion-content>
  <div class="container">
    <ion-icon
      (click)="navigateBack()"
      name="arrow-back-outline"
      class="back-arrow"
    ></ion-icon>
    <div class="framer">
      <h2>Forgot Password</h2>
      <p>
        Enter email to send the OTP code <br />
        to reset your password
      </p>
    </div>

    <form class="email-form">
      <div style="padding-top: 20px">
        <ion-input
          label="Email Address"
          label-placement="floating"
          fill="outline"
          placeholder="Email Address"
          style="color: #505050"
          [(ngModel)]="email"
          name="email"
          type="email"
          required
        ></ion-input>
      </div>
      
      <!-- Error message -->
      <div *ngIf="error" style="color: red; font-size: 14px; margin-top: 10px;">
        {{ error }}
      </div>
      
      <!-- Success message -->
      <div *ngIf="success" style="color: green; font-size: 14px; margin-top: 10px;">
        {{ success }}
      </div>
    </form>

    <ion-button
      expand="block"
      class="create-account"
      (click)="sendPasswordResetEmail()"
      [disabled]="loading"
    >
      <ion-spinner *ngIf="loading" name="crescent" style="margin-right: 8px;"></ion-spinner>
      {{ loading ? 'Sending...' : 'Send Reset Email' }}
    </ion-button>
  </div>
</ion-content>
