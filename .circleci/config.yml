version: 2.1
executors:
  node-executor:
    docker:
      - image: cimg/node:18.20.5-browsers
    working_directory: ~/project

jobs:
  build:
    executor: node-executor
    environment:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-cache-{{ checksum "package-lock.json" }}
            - npm-cache-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          paths:
            - ~/.npm
          key: npm-cache-{{ checksum "package-lock.json" }}
      - run:
          name: Install Ionic CLI
          command: npm install -g @ionic/cli
      - run:
          name: Verify Chrome Binary
          command: |
            echo "Checking for Chrome binary..."
            which google-chrome || echo "Chrome binary not found"
      - run:
          name: Run unit testing
          command: |
            npm run test
      - store_test_results:
          path: ~/project/junit

workflows:
  version: 2
  build_and_serve:
    jobs:
      - build
