version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:18.20.5-browsers
    working_directory: ~/project

jobs:
  build:
    executor: node-executor
    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-cache-{{ checksum "package-lock.json" }}
            - npm-cache-

      - run:
          name: Install dependencies
          command: npm install

      - save_cache:
          paths:
            - ~/.npm
          key: npm-cache-{{ checksum "package-lock.json" }}

      - run:
          name: Install Ionic CLI
          command: npm install -g @ionic/cli

      - run:
          name: Install Chromium and dependencies
          command: |
            echo "Checking for Chrome binary..."
            if ! [ -x "$(command -v google-chrome)" ] && ! [ -x "$(command -v chromium)" ] && ! [ -x "$(command -v chromium-browser)" ]; then
              echo "No Chrome binary found, installing Chromium..."
              sudo apt-get update
              sudo apt-get install -y wget libvulkan1
              wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              sudo dpkg -i google-chrome-stable_current_amd64.deb || true
              sudo apt-get -f install -y
            fi
            echo "Chrome binary found or installed."

      - run:
          name: Detect Chrome binary and set CHROME_BIN
          command: |
            echo "Detecting available Chrome binary..."
            if [ -x "$(command -v google-chrome)" ]; then
              export CHROME_BIN=$(command -v google-chrome)
            elif [ -x "$(command -v chromium-browser)" ]; then
              export CHROME_BIN=$(command -v chromium-browser)
            elif [ -x "$(command -v chromium)" ]; then
              export CHROME_BIN=$(command -v chromium)
            else
              echo "No Chrome binary found." && exit 1
            fi
            echo "Found Chrome binary at: $CHROME_BIN"
            echo "export CHROME_BIN=$CHROME_BIN" >> $BASH_ENV
            source $BASH_ENV

      - run:
          name: Run unit tests
          command: npm run test

      - store_test_results:
          path: ~/project/junit

      - run:
          name: Create dummy artifact
          command: echo "This is a dummy artifact" > dummy_artifact.txt

      - store_artifacts:
          path: dummy_artifact.txt

workflows:
  version: 2
  build_and_serve:
    jobs:
      - build
