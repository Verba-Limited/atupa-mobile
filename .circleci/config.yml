version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:18.20.5-browsers
    working_directory: ~/project

jobs:
  build:
    executor: node-executor
    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-cache-{{ checksum "package-lock.json" }}
            - npm-cache-

      - run:
          name: Install dependencies
          command: npm install

      - save_cache:
          paths:
            - ~/.npm
          key: npm-cache-{{ checksum "package-lock.json" }}

      - run:
          name: Install Ionic CLI
          command: npm install -g @ionic/cli

      - run:
          name: Detect Chrome binary and set CHROME_BIN
          command: |
            echo "Detecting available Chrome binary..."
            if [ -x "$(command -v google-chrome)" ]; then
              export CHROME_BIN=$(command -v google-chrome)
            elif [ -x "$(command -v chromium-browser)" ]; then
              export CHROME_BIN=$(command -v chromium-browser)
            elif [ -x "$(command -v chromium)" ]; then
              export CHROME_BIN=$(command -v chromium)
            else
              echo "No Chrome binary found." && exit 1
            fi
            echo "Found Chrome binary at: $CHROME_BIN"
            echo "export CHROME_BIN=$CHROME_BIN" >> $BASH_ENV
            source $BASH_ENV

      - run:
          name: Run unit tests
          command: npm run test

      - store_test_results:
          path: ~/project/junit

workflows:
  version: 2
  build_and_serve:
    jobs:
      - build
